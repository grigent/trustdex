name: Create GitHub Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (must match package.json version, for example v0.3.0)
        required: true
        default: v0.4.4
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    if: "${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'release: publish TrustDex v') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Use current npm metadata rules
        run: npm install --global npm@^11.15.0

      - name: Validate canonical npm metadata
        shell: bash
        run: |
          npm pkg fix
          git diff --exit-code -- package.json

      - name: Resolve and validate release tag
        id: version
        shell: bash
        env:
          REQUESTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || '' }}
        run: |
          set -euo pipefail
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          EXPECTED_TAG="v$PACKAGE_VERSION"
          RELEASE_TAG="$REQUESTED_TAG"
          if [[ -z "$RELEASE_TAG" ]]; then
            RELEASE_TAG="$EXPECTED_TAG"
          fi
          if [[ "$RELEASE_TAG" != "$EXPECTED_TAG" ]]; then
            echo "Requested tag $RELEASE_TAG does not match package.json version $PACKAGE_VERSION"
            exit 1
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - run: npm test
      - run: npm run check
      - run: npm pack --dry-run

      - name: Build release package, SBOM, and checksums
        id: artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          PACKAGE_FILE="$(npm pack --pack-destination dist --json | node -e '
            let input = "";
            process.stdin.on("data", (chunk) => { input += chunk; });
            process.stdin.on("end", () => {
              const report = JSON.parse(input);
              process.stdout.write(report[0].filename);
            });
          ')"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          SBOM_FILE="trustdex-v${PACKAGE_VERSION}.sbom.cdx.json"
          npm sbom --sbom-format=cyclonedx > "dist/$SBOM_FILE"
          (
            cd dist
            shasum -a 256 "$PACKAGE_FILE" "$SBOM_FILE" > SHA256SUMS
          )
          echo "package_path=dist/$PACKAGE_FILE" >> "$GITHUB_OUTPUT"
          echo "sbom_path=dist/$SBOM_FILE" >> "$GITHUB_OUTPUT"
          echo "checksums_path=dist/SHA256SUMS" >> "$GITHUB_OUTPUT"

      - name: Attest release package provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ steps.artifacts.outputs.package_path }}

      - name: Attest release package SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ steps.artifacts.outputs.package_path }}
          sbom-path: ${{ steps.artifacts.outputs.sbom_path }}

      - name: Create release and tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          PACKAGE_PATH: ${{ steps.artifacts.outputs.package_path }}
          SBOM_PATH: ${{ steps.artifacts.outputs.sbom_path }}
          CHECKSUMS_PATH: ${{ steps.artifacts.outputs.checksums_path }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists."
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            --target "${{ github.sha }}" \
            --title "TrustDex $RELEASE_TAG" \
            --generate-notes \
            "$PACKAGE_PATH" \
            "$SBOM_PATH" \
            "$CHECKSUMS_PATH"
