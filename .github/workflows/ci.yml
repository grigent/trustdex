name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Node.js ${{ matrix.node-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node-version: 20
          - os: ubuntu-latest
            node-version: 22
          - os: windows-latest
            node-version: 22
          - os: macos-latest
            node-version: 22

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}

      - run: npm test
      - run: npm run check

      - name: Verify strict example blocks unknown tool
        shell: bash
        run: |
          set +e
          node ./bin/trustdex.mjs inspect ./examples/mcp.json \
            --pack strict \
            --policy ./examples/trustdex.policy.json
          code=$?
          test "$code" -eq 2

      - name: Verify gate removes blocked tool
        shell: bash
        run: |
          node ./bin/trustdex.mjs gate ./examples/mcp.json \
            --pack strict \
            --policy ./examples/trustdex.policy.json \
            --out .trustdex/gated.json
          node -e '
            const fs = require("fs");
            const value = JSON.parse(fs.readFileSync(".trustdex/gated.json", "utf8"));
            const names = Object.keys(value.mcpServers || value);
            if (names.includes("unknown-calendar")) process.exit(1);
          '

      - name: Verify Codex config gate
        shell: bash
        run: |
          node ./bin/trustdex.mjs inspect-codex ./examples/codex.config.toml \
            --pack development || test "$?" -eq 1
          node ./bin/trustdex.mjs gate-codex ./examples/codex.config.toml \
            --pack strict \
            --out .trustdex/codex-gated.toml
          grep -q '\[features\]' .trustdex/codex-gated.toml
          if grep -q '\[mcp_servers.remote-example\]' .trustdex/codex-gated.toml; then
            exit 1
          fi

      - name: Verify signed trust record round trip
        shell: bash
        run: |
          node ./bin/trustdex.mjs snapshot ./examples/mcp.json \
            --pack strict \
            --policy ./examples/trustdex.policy.json \
            --out .trustdex/snapshot.json
          node ./bin/trustdex.mjs keygen \
            --private .trustdex/private.pem \
            --public .trustdex/public.pem
          node ./bin/trustdex.mjs sign .trustdex/snapshot.json \
            --private .trustdex/private.pem \
            --out .trustdex/record.json
          node ./bin/trustdex.mjs verify .trustdex/record.json \
            --public .trustdex/public.pem \
            --snapshot .trustdex/snapshot.json

      - name: Verify automatic re-review workflow
        shell: bash
        run: |
          node ./bin/trustdex.mjs approve ./examples/mcp.json \
            --pack development \
            --private .trustdex/private.pem \
            --dir .trustdex/review
          node ./bin/trustdex.mjs recheck ./examples/mcp.json \
            --review-dir .trustdex/review \
            --public .trustdex/public.pem

  action-smoke:
    name: Composite Action smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Run the checked-out TrustDex Action
        uses: ./
        with:
          config: ./examples/mcp.json
          pack: strict
          policy: ./examples/trustdex.policy.json
          output: .trustdex/action-gated.json

      - name: Verify Action output
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const value = JSON.parse(fs.readFileSync(".trustdex/action-gated.json", "utf8"));
            const names = Object.keys(value.mcpServers || value);
            if (names.join(",") !== "filesystem") {
              console.error("Unexpected gated servers:", names);
              process.exit(1);
            }
          '
