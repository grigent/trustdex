name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm test
      - run: npm run check
      - name: Verify strict example blocks unknown tool
        shell: bash
        run: |
          set +e
          node ./bin/trustdex.mjs inspect ./examples/mcp.json --policy ./examples/trustdex.policy.json
          code=$?
          test "$code" -eq 2
