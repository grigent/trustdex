name: Feature proposal
description: Propose a focused improvement or compatibility adapter.
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What maintainer or user problem should TrustDex solve?
    validations:
      required: true
  - type: textarea
    id: boundary
    attributes:
      label: Trust boundary
      description: What evidence is available, and what should remain ASK or BLOCK?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and tradeoffs
      description: Include false-positive and false-negative concerns.
  - type: textarea
    id: examples
    attributes:
      label: Public or fully redacted examples
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This proposal does not require TrustDex to certify third-party software as safe.
          required: true
        - label: Any example is public or fully redacted.
          required: true
